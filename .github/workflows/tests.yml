name: inertia-i18n

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Inertia ${{ matrix.inertia }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12', inertia: '2', testbench: '10', pest: '3' }
          - { php: '8.2', laravel: '12', inertia: '3', testbench: '10', pest: '3' }
          - { php: '8.3', laravel: '13', inertia: '2', testbench: '11', pest: '4' }
          - { php: '8.4', laravel: '13', inertia: '3', testbench: '11', pest: '4' }
          - { php: '8.5', laravel: '13', inertia: '3', testbench: '11', pest: '4' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # Composer's default security policy stays on: dependency sets with
      # known advisories fail to resolve instead of being installed.
      - name: Install dependencies
        run: >-
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          --with="illuminate/support:^${{ matrix.laravel }}.0"
          --with="illuminate/view:^${{ matrix.laravel }}.0"
          --with="inertiajs/inertia-laravel:^${{ matrix.inertia }}.0"
          --with="orchestra/testbench:^${{ matrix.testbench }}.0"
          --with="pestphp/pest:^${{ matrix.pest }}.0"

      - name: Run tests
        run: composer test

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
