name: inertia-i18n

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^10.0'
            inertia: '^2.0'
            testbench: '^8.0'
            pest: '^2.0'
          - php: '8.2'
            laravel: '^11.35'
            inertia: '^2.0'
            testbench: '^9.0'
            pest: '^3.0'
          - php: '8.2'
            laravel: '^11.35'
            inertia: '^3.0'
            testbench: '^9.0'
            pest: '^3.0'
          - php: '8.2'
            laravel: '^12.0'
            inertia: '^2.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.2'
            laravel: '^12.0'
            inertia: '^3.0'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            inertia: '^2.0'
            testbench: '^11.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '^13.0'
            inertia: '^3.0'
            testbench: '^11.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            inertia: '^3.0'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Resolve compatible dependency family
        run: >-
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          --with="illuminate/support:${{ matrix.laravel }}"
          --with="illuminate/view:${{ matrix.laravel }}"
          --with="inertiajs/inertia-laravel:${{ matrix.inertia }}"
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --with="pestphp/pest:${{ matrix.pest }}"
      - name: Check PHP syntax
        run: find src config tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run PHP tests
        run: composer test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
